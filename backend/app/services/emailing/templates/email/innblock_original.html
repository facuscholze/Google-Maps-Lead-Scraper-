<script>
// ---------- Servicios (podés agregar, quitar o editar filas) ----------
const SERVICIOS = [
  { titulo: "Software a medida", texto: "Sistemas internos, paneles e integraciones para dejar de cargar cosas a mano.", tiempo: "6–10 sem" },
  { titulo: "Automatización",    texto: "Que las tareas repetitivas dejen de comerse el día. Flujos, integraciones y alertas.", tiempo: "2–6 sem" },
  { titulo: "Marca",             texto: "Identidad y sistema visual: no un logo suelto, sino la base de todo lo demás.", tiempo: "3–5 sem" },
  { titulo: "Ingeniería",        texto: "Sitios y aplicaciones web rápidos, accesibles y fáciles de mantener.", tiempo: "4–8 sem" },
  { titulo: "Seguridad",         texto: "Revisión de accesos, datos personales, backups y dependencias viejas.", tiempo: "1–3 sem" },
];

// ---------- Motor (no hace falta tocar) ----------
function filasServicios() {
  const mono = "font-family:'Martian Mono','Courier New',monospace;";
  return SERVICIOS.map((s, i) => {
    const borde = i === 0 ? `border-top:1px solid ${CONFIG.negro};` : "border-top:1px solid #e3e3e3;";
    const fin   = i === SERVICIOS.length - 1 ? `border-bottom:1px solid ${CONFIG.negro};` : "";
    return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="${borde}${fin}"><tr>
      <td width="40" valign="top" style="padding:16px 0;${mono}color:${CONFIG.rojo};font-size:12px;">${String(i + 1).padStart(2, "0")}</td>
      <td valign="top" style="padding:16px 0;"><p style="margin:0 0 4px 0;color:${CONFIG.negro};font-size:16px;font-weight:600;">${s.titulo}</p><p style="margin:0;color:#666666;font-size:13px;line-height:20px;">${s.texto}</p></td>
      <td width="90" align="right" valign="top" style="padding:16px 0;${mono}color:#777777;font-size:11px;">${s.tiempo}</td>
    </tr></table>`;
  }).join("\n");
}

function filaFirma() {
  const mono = "font-family:'Martian Mono','Courier New',monospace;";
  const celdas = CONFIG.socios.map(p => {
    const wa = "https://wa.me/" + p.telefono.replace(/\D/g, "");
    return `<td class="col" width="${Math.floor(100 / CONFIG.socios.length)}%" valign="top" style="padding:0 16px 0 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        <td valign="top" style="border-left:3px solid ${CONFIG.rojo};padding:2px 0 2px 12px;">
          <p style="margin:0;color:${CONFIG.negro};font-size:16px;font-weight:800;">${p.nombre}</p>
          <p style="margin:3px 0 0 0;${mono}color:${CONFIG.rojo};font-size:11px;letter-spacing:1px;text-transform:uppercase;">${p.rol} · ${CONFIG.empresa}</p>
          <p style="margin:6px 0 0 0;font-size:13px;"><a href="${wa}" style="color:#555555;text-decoration:none;">${p.telefono}</a></p>
        </td>
      </tr></table>
    </td>`;
  }).join("");
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>${celdas}</tr></table>`;
}

function armarMail() {
  const datos = { ...CONFIG, servicios: filasServicios(), firma: filaFirma() };
  return document.getElementById("plantilla").textContent.trim()
    .replace(/{{(\w+)}}/g, (m, k) => (k in datos ? datos[k] : m));
}

const MAIL = armarMail();
const vista = document.getElementById("vista");
const asuntoEl = document.getElementById("asuntoTxt");
asuntoEl.textContent = CONFIG.asunto;
let editando = true;

// Marca punteada roja al pasar el mouse por un texto editable (no se copia al mail)
const ESTILO_EDICION = `
  body[data-editando] p:hover, body[data-editando] h1:hover, body[data-editando] a:hover {
    outline: 1px dashed rgba(217,0,0,.6); outline-offset: 3px; cursor: text; }`;

function ajustarAltura() {
  vista.style.height = vista.contentDocument.documentElement.scrollHeight + 40 + "px";
}

vista.onload = () => {
  const d = vista.contentDocument;
  const st = d.createElement("style");
  st.id = "__edicion"; st.textContent = ESTILO_EDICION;
  d.head.appendChild(st);
  d.addEventListener("input", ajustarAltura);
  aplicarEdicion();
  ajustarAltura();
};
vista.srcdoc = MAIL;

function aplicarEdicion() {
  const d = vista.contentDocument;
  d.designMode = editando ? "on" : "off";
  if (editando) d.body.setAttribute("data-editando", "");
  else d.body.removeAttribute("data-editando");
  const b = document.getElementById("btnEditar");
  b.textContent = editando ? "✏️ Edición: ON" : "✏️ Edición: OFF";
  b.className = editando ? "" : "alt";
}
function toggleEdicion() { editando = !editando; aplicarEdicion(); }
function restablecer() {
  if (confirm("¿Descartar los cambios hechos en la vista y volver al texto original?")) {
    asuntoEl.textContent = CONFIG.asunto;
    vista.srcdoc = MAIL;
  }
}

// Devuelve el HTML final con tus ediciones, sin las herramientas de edición
function mailActual() {
  const copia = vista.contentDocument.documentElement.cloneNode(true);
  const st = copia.querySelector("#__edicion"); if (st) st.remove();
  copia.querySelector("body").removeAttribute("data-editando");
  return "<!DOCTYPE html>\n" + copia.outerHTML;
}

function aviso(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}
function copiarTexto(txt) {
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  document.execCommand("copy"); ta.remove();
}
function copiarAsunto() { copiarTexto(asuntoEl.textContent.trim()); aviso("Asunto copiado"); }
function copiarHTML()   { copiarTexto(mailActual()); aviso("Código HTML copiado (con tus cambios). Pegalo en Brevo o Mailchimp."); }
function copiarParaGmail() {
  const d = vista.contentDocument;
  d.body.removeAttribute("data-editando");               // saca las marcas de edición
  const r = d.createRange(), s = d.getSelection();
  r.selectNodeContents(d.body); s.removeAllRanges(); s.addRange(r);
  d.execCommand("copy"); s.removeAllRanges();
  if (editando) d.body.setAttribute("data-editando", "");
  aviso("Copiado con tus cambios. Pegalo con Ctrl+V en el cuerpo del mail de Gmail.");
}
function descargar() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([mailActual()], { type: "text/html" }));
  a.download = `mail-${CONFIG.nombre.toLowerCase().replace(/\s+/g, "-")}.html`;
  a.click();
}
</script>
